#
# Federated CFR Connect Protocol (FCP).
#
# Prerequisites: configure a protected GitHub environment named
# `maven-central-release` with MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD,
# MAVEN_CENTRAL_GPG_PRIVATE_KEY and MAVEN_CENTRAL_GPG_PASSPHRASE secrets.
name: libfcp Maven Central release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH-MAVEN-CENTRAL to upload the checked-out signed bundle
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: libfcp-maven-central-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and upload signed Central bundle
    environment: maven-central-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # actions/checkout v5, pinned by immutable commit SHA.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # actions/setup-java v5, pinned by immutable commit SHA.
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"
      # dtolnay/rust-toolchain, pinned by immutable commit SHA.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.0"
      - name: Require explicit release confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "PUBLISH-MAVEN-CENTRAL"
      - name: Install Kotlin compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq kotlin
      - name: Import Maven Central signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}
        run: printf '%s' "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
      - name: Verify signed package and clean consumer
        env:
          LIBFCP_JVM_SIGN: "1"
          LIBFCP_JVM_GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
        run: |
          ./scripts/test_jvm_maven_package.sh
      - name: Build signed Central bundle
        env:
          LIBFCP_JVM_PACKAGE_DIR: ${{ github.workspace }}/dist/jvm-maven
          LIBFCP_JVM_SIGN: "1"
          LIBFCP_JVM_GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
        run: ./scripts/package_jvm_bindings.sh
      # actions/upload-artifact v4.6.2, pinned by immutable commit SHA.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: libfcp-maven-central-signed-bundle
          path: dist/jvm-maven/libfcp-1.0.0-rc.1-central-bundle.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload bundle to Maven Central Portal
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          curl --fail-with-body --silent --show-error \
            --user "$MAVEN_CENTRAL_USERNAME:$MAVEN_CENTRAL_PASSWORD" \
            --request POST \
            --form bundle=@dist/jvm-maven/libfcp-1.0.0-rc.1-central-bundle.zip \
            "https://central.sonatype.com/api/v1/publisher/upload?name=libfcp-1.0.0-rc.1&publishingType=USER_MANAGED"
