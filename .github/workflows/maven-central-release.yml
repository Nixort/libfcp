#
# Federated CFR Connect Protocol (FCP).
#
# Prerequisites: configure a protected GitHub environment named
# `maven-central-release` with MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD,
# MAVEN_CENTRAL_GPG_PRIVATE_KEY and MAVEN_CENTRAL_GPG_PASSPHRASE secrets.
name: libfcp Maven Central release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Validate credentials and a signed bundle, or upload the checked-out bundle"
        required: true
        type: choice
        options: [validate, publish]
        default: validate
      confirmation:
        description: "Type PUBLISH-MAVEN-CENTRAL only when operation is publish"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: libfcp-maven-central-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and validate signed Central bundle
    environment: maven-central-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # actions/checkout v5, pinned by immutable commit SHA.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Verify versioned release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$release_version"
          test "$RELEASE_TAG" = "v$release_version"
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
      # actions/setup-java v5, pinned by immutable commit SHA.
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "17"
      # dtolnay/rust-toolchain, pinned by immutable commit SHA.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.98.0"
      - name: Require explicit release confirmation
        if: inputs.operation == 'publish'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "PUBLISH-MAVEN-CENTRAL"
      - name: Validate Central Portal credential presence without upload
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          test -n "$MAVEN_CENTRAL_USERNAME"
          test -n "$MAVEN_CENTRAL_PASSWORD"
      - name: Download verified native classifier artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="$(./scripts/release_metadata.sh version)"
          classifier_run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow jvm-native-classifiers.yml \
            --commit "$GITHUB_SHA" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$classifier_run_id"
          mkdir -p native-classifiers
          for classifier in linux-x86_64 macos-x86_64 macos-aarch64; do
            gh run download "$classifier_run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name "libfcp-jvm-native-$classifier" \
              --dir native-classifiers
            test -f "native-classifiers/libfcp-$release_version-$classifier.jar"
          done
      - name: Install Kotlin compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq kotlin
      - name: Import Maven Central signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}
        run: printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Verify signed package and clean consumer
        env:
          LIBFCP_JVM_PREBUILT_CLASSIFIERS_DIR: ${{ github.workspace }}/native-classifiers
          LIBFCP_JVM_SIGN: "1"
          LIBFCP_JVM_GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
        run: |
          ./scripts/test_release_metadata_contract.sh
          ./scripts/test_jvm_maven_package.sh
      - name: Build signed Central bundle
        env:
          LIBFCP_JVM_PACKAGE_DIR: ${{ github.workspace }}/dist/jvm-maven
          LIBFCP_JVM_SIGN: "1"
          LIBFCP_JVM_GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
        run: ./scripts/package_jvm_bindings.sh
      # actions/upload-artifact v4.6.2, pinned by immutable commit SHA.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: libfcp-maven-central-signed-bundle
          path: dist/jvm-maven/libfcp-*-central-bundle.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload bundle to Maven Central Portal
        if: inputs.operation == 'publish'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          release_version="$(./scripts/release_metadata.sh version)"
          curl --fail-with-body --silent --show-error \
            --user "$MAVEN_CENTRAL_USERNAME:$MAVEN_CENTRAL_PASSWORD" \
            --request POST \
            --form "bundle=@dist/jvm-maven/libfcp-$release_version-central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=libfcp-$release_version&publishingType=USER_MANAGED"
