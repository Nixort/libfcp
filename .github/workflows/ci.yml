# Federated CFR Connect Protocol (FCP).

name: libfcp CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libfcp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable protocol and SDK (Rust 1.85)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # actions/checkout v5, pinned by immutable commit SHA.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # dtolnay/rust-toolchain, pinned by immutable commit SHA.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
          targets: aarch64-linux-android,aarch64-apple-ios,wasm32-unknown-unknown
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify cross-platform publication contract
        run: ./scripts/test_cross_platform_publication_contract.sh
      - name: Verify release metadata contract
        run: ./scripts/test_release_metadata_contract.sh
      - name: Test Rust 1.85 portable crates
        run: |
          cargo test \
            -p libfcp-core \
            -p libfcp \
            -p libfcp-server \
            -p libfcp-ffi \
            -p libfcp-wasm \
            --locked
      - name: Lint Rust 1.85 portable crates
        run: |
          cargo clippy \
            -p libfcp-core \
            -p libfcp \
            -p libfcp-server \
            -p libfcp-ffi \
            -p libfcp-wasm \
            --all-targets --locked -- -D warnings
      - name: Check portable core targets
        run: |
          cargo check -p libfcp-core --no-default-features --locked --target aarch64-linux-android
          cargo check -p libfcp-core --no-default-features --locked --target aarch64-apple-ios
          cargo check -p libfcp-core --no-default-features --locked --target wasm32-unknown-unknown
      - name: Verify standalone core package
        run: cargo package -p libfcp-core --locked

  webrtc:
    name: Concrete WebRTC adapter (Rust stable)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # actions/checkout v5, pinned by immutable commit SHA.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # dtolnay/rust-toolchain, pinned by immutable commit SHA.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy
      - name: Test real localhost WebRTC adapter
        run: cargo test -p libfcp-webrtc --tests --locked -- --nocapture
      - name: Lint concrete WebRTC adapter
        run: cargo clippy -p libfcp-webrtc --all-targets --locked -- -D warnings
