# Federated CFR Connect Protocol (FCP).

name: libfcp supply chain

on:
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "crates/**/Cargo.toml", "deny.toml", ".github/workflows/security.yml"]
  push:
    branches: [main]
    paths: ["Cargo.toml", "Cargo.lock", "crates/**/Cargo.toml", "deny.toml", ".github/workflows/security.yml"]
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libfcp-supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Advisory database audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # actions/checkout v5, pinned by immutable commit SHA.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # dtolnay/rust-toolchain, pinned by immutable commit SHA.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Install locked audit tool
        run: cargo +stable install cargo-audit --version 0.22.2 --locked
      - name: Fail on vulnerable, yanked, or unmaintained dependencies
        run: cargo +stable audit --deny warnings

  policy:
    name: License and source policy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # actions/checkout v5, pinned by immutable commit SHA.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # dtolnay/rust-toolchain, pinned by immutable commit SHA.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Install locked dependency-policy tool
        run: cargo +stable install cargo-deny --version 0.20.2 --locked
      - name: Enforce advisory, license, duplicate, ban, and source policy
        run: cargo +stable deny check all
      - name: Record dependency graph for review
        run: cargo +stable tree --workspace --all-features --locked > dependency-tree.txt
      # actions/upload-artifact v4.6.2, pinned by immutable commit SHA.
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: libfcp-dependency-tree
          path: dependency-tree.txt
          if-no-files-found: error
