#
# Federated CFR Connect Protocol (FCP).
#
# Prerequisite: configure the CARGO_REGISTRY_TOKEN repository secret and a
# protected GitHub environment named `crates-io-release` with required review.

name: libfcp release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Validate credentials or publish the checked-out release candidate"
        required: true
        type: choice
        options: [validate, publish]
        default: validate
      confirmation:
        description: "Type PUBLISH-LIBFCP only when operation is publish"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: libfcp-crates-io-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate and crates.io credential
    environment: crates-io-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout v5, pinned by immutable commit SHA.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Verify versioned release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$release_version"
          test "$RELEASE_TAG" = "v$release_version"
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
      # dtolnay/rust-toolchain, pinned by immutable commit SHA.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Require an explicit release confirmation
        if: inputs.operation == 'publish'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "PUBLISH-LIBFCP"
      - name: Validate crates.io token injection without publication
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          cargo login --registry crates-io "$CARGO_REGISTRY_TOKEN"
          test -s "$CARGO_HOME/credentials.toml"
          # Scoped publish tokens intentionally cannot call read endpoints such
          # as /me. The first network validation therefore remains cargo publish,
          # which is available only through operation=publish and confirmation.
      - name: Run release quality gate
        run: |
          cargo fmt --all -- --check
          ./scripts/test_cross_platform_publication_contract.sh
          ./scripts/test_release_metadata_contract.sh
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo build --release --workspace --locked
      - name: Verify standalone core package
        run: cargo package -p libfcp-core --locked

  publish:
    name: Publish packages in dependency order
    if: inputs.operation == 'publish'
    needs: validate
    environment: crates-io-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # actions/checkout v5, pinned by immutable commit SHA.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Verify versioned release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$release_version"
          test "$RELEASE_TAG" = "v$release_version"
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
      # dtolnay/rust-toolchain, pinned by immutable commit SHA.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Publish in internal dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          release_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$release_version"
          publish_and_wait() {
            package="$1"
            cargo publish --locked -p "$package"
            for attempt in $(seq 1 40); do
              if cargo info "$package@$release_version" >/dev/null 2>&1; then
                return 0
              fi
              sleep 15
            done
            echo "Timed out waiting for $package v$release_version in crates.io index" >&2
            return 1
          }
          publish_and_wait libfcp-core
          publish_and_wait libfcp-server
          publish_and_wait libfcp
          publish_and_wait libfcp-webrtc
