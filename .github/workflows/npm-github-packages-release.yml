#
# Federated CFR Connect Protocol (FCP).
#
# Prerequisite: configure the protected `github-packages-release` environment
# with required review. This workflow is triggered only after a maintainer
# publishes a GitHub prerelease whose v-prefixed tag matches package.json.

name: libfcp npm GitHub Packages release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: libfcp-npm-github-packages-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish reviewed npm prerelease to GitHub Packages
    if: github.event.release.prerelease
    environment: github-packages-release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      # actions/checkout v4.1.7, pinned by immutable commit SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.release.tag_name }}
      # actions/setup-node v4, pinned by immutable commit SHA.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.14.0"
          registry-url: https://npm.pkg.github.com
          scope: "@nixort"
          package-manager-cache: false
      # dtolnay/rust-toolchain, pinned by immutable commit SHA.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.117 --locked
      - name: Require matching prerelease tag and validate package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "${RELEASE_TAG#v}" = "$(node -p "require('./bindings/js/package.json').version")"
          ./scripts/test_js_npm_package.sh
      - name: Build npm package
        run: |
          LIBFCP_NPM_PACKAGE_DIR="$GITHUB_WORKSPACE/dist/npm" \
            ./scripts/package_js_npm.sh
      - name: Publish to GitHub Packages
        working-directory: dist/npm/package
        run: npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # actions/attest v4, pinned by immutable commit SHA.
      - name: Attest published tarball
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/npm/tarballs/*.tgz
